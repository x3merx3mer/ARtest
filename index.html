<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rocket Viewer with AR</title>
    <!-- Load Tailwind CSS for styling and responsiveness -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to ensure the viewer takes up the full screen/viewport */
        body {
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Load the model-viewer library from Google -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/1.10.1/model-viewer.min.js"></script>
</head>
<body class="bg-gray-900 text-white">

    <!-- Header for context -->
    <header class="absolute top-0 left-0 w-full p-4 bg-gray-800 bg-opacity-70 z-10 shadow-lg">
        <h1 class="text-xl font-bold text-center">AR Rocket Model</h1>
        <p class="text-sm text-center text-gray-400">View in 3D, and tap the AR button to place it in your world!</p>
    </header>

    <!--
        The model-viewer element:
        - src: Points to the .glb file hosted on GitHub.
        - ar: Enables Augmented Reality mode (requires an ARCore/ARKit compatible device).
        - ar-modes: Specifies the methods for AR (webxr is standard, scene-viewer is a fallback for Android).
        - camera-controls: Allows the user to rotate and zoom the model.
        - auto-rotate: Makes the model spin slowly by default.
        - shadow-intensity: Adjusts the shadow strength for better realism.
    -->
    <model-viewer
        src="https://static.wixstatic.com/3d/ea23d8_548c5c649d9b45b79f8f41cf850ae351.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        alt="A 3D model of a rocket"
    >
        <!-- Custom button for AR mode, visible on compatible devices -->
        <button slot="ar-button" class="absolute bottom-6 right-6 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-full shadow-xl transition transform hover:scale-105 active:scale-95">
            🚀 Activate AR
        </button>
    </model-viewer>

</body>
</html>
