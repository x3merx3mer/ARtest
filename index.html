<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Model Viewer with AR</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Set the body and html to take full screen height for centering */
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #1f2937; /* Dark background */
        }
        /* Custom styling for model-viewer to make it visually appealing */
        model-viewer {
            width: 100%;
            height: 80vh; /* Takes 80% of viewport height */
            background-color: #2c3e50; /* Slightly lighter viewer background */
            border-radius: 1.5rem; /* Rounded corners */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            --poster-color: #4b5563; /* Custom color for the loading poster */
        }
    </style>
    <!-- Load the model-viewer component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/1.13.0/model-viewer.min.js"></script>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-8">

    <header class="text-center mb-6 w-full max-w-4xl">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-white">Interactive 3D Model</h1>
        <p class="text-gray-400 mt-2 text-lg">View, rotate, and experience this model in Augmented Reality.</p>
    </header>

    <main class="w-full max-w-4xl">
        <!-- The model-viewer component -->
        <model-viewer
            id="model-viewer-element"
            src="https://static.wixstatic.com/3d/ea23d8_548c5c649d9b45b79f8f41cf850ae351.glb"
            alt="A detailed 3D geometric model"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            shadow-intensity="1"
            exposure="1.2"
            class="mx-auto"
        >
            <!-- Slot for AR button (model-viewer handles button appearance) -->
            <button slot="ar-button" id="ar-button" class="mt-4 px-6 py-3 bg-indigo-600 text-white font-bold rounded-full shadow-lg hover:bg-indigo-700 transition duration-300 transform hover:scale-105">
                ✨ View in AR
            </button>
        </model-viewer>
    </main>

    <footer class="mt-6 text-center text-sm text-gray-500 w-full max-w-4xl">
        <p id="footer-text">Initializing AR check...</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modelViewer = document.getElementById('model-viewer-element');
            const arButton = document.getElementById('ar-button');
            const footerText = document.getElementById('footer-text');
            
            if (modelViewer && arButton) {
                // Listen for the model to be loaded and AR readiness to be determined
                modelViewer.addEventListener('loaded', () => {
                    // Check if the model-viewer component determined that AR is supported
                    if (modelViewer.hasAttribute('ar-status') && modelViewer.getAttribute('ar-status') === 'supported') {
                        // AR is supported, the button is visible and functional
                        footerText.textContent = 'Use your mouse/touch to orbit and zoom the model. Tap "View in AR" on a compatible mobile device.';
                    } else {
                        // AR is NOT supported (e.g., desktop, non-secure environment). Hide the button and display a message.
                        arButton.style.display = 'none'; // Hide the button
                        footerText.innerHTML = 'AR is not supported in this environment. <br> **Requirements:** Compatible mobile device AND a secure (HTTPS) connection.';
                        console.warn("AR not supported. Ensure you are on a compatible mobile device and the page is loaded via HTTPS.");
                    }
                });
            }
        });
    </script>
</body>
</html>
